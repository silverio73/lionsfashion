<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>LIONS FASHION • Premium Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #00bfff;
            --primary-dark: #0099cc;
            --primary-light: #66d9ff;
            --success: #00bfff;
            --danger: #ff5252;
            --warning: #ffb74d;
            --info: #29b6f6;
            --mpesa: #e2006e;
            --emola: #00a859;
            --gradient-primary: linear-gradient(135deg, #00bfff 0%, #00aced 50%, #0099cc 100%);
            --gradient-mpesa: linear-gradient(135deg, #e2006e 0%, #c2005e 50%, #9e004a 100%);
            --gradient-emola: linear-gradient(135deg, #00a859 0%, #008040 50%, #006030 100%);
            --gradient-bg: linear-gradient(135deg, #0a0a2a 0%, #0a0a2f 25%, #0a0a25 50%, #050520 75%, #0a0a25 100%);
            --shadow-neon: 0 0 20px rgba(0, 191, 255, 0.5);
            --shadow-3d: 0 15px 35px rgba(0, 0, 0, 0.3);
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--gradient-bg);
            background-size: 400% 400%;
            animation: gradientBG 10s ease infinite;
            min-height: 100vh;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes fadeInUp { 
            from { opacity: 0; transform: translateY(50px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        
        @keyframes pulseGlow { 
            0%,100% { box-shadow: 0 0 10px rgba(0, 191, 255, 0.3); }
            50% { box-shadow: 0 0 30px rgba(0, 191, 255, 0.6); }
        }
        
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        .login-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(135deg, #0a0a2a 0%, #0a0a2f 100%);
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
            padding: 20px; 
        }
        
        .login-card { 
            background: rgba(0, 30, 50, 0.4); 
            backdrop-filter: blur(20px); 
            border-radius: 48px; 
            padding: 50px 40px; 
            width: 100%; 
            max-width: 480px; 
            border: 1px solid rgba(0, 191, 255, 0.4); 
            animation: fadeInUp 0.8s ease;
        }
        
        .login-card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-3d), var(--shadow-neon);
        }
        
        .login-logo { text-align: center; margin-bottom: 40px; }
        .login-logo .logo-icon { font-size: 4.5em; color: var(--primary); animation: pulseGlow 2s infinite; display: inline-block; }
        .login-logo h1 { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2em; font-weight: 800; }
        
        .input-group { margin-bottom: 25px; }
        .input-group label { display: block; color: white; margin-bottom: 8px; font-weight: 600; }
        .input-group input { 
            width: 100%; 
            padding: 16px 20px; 
            background: rgba(0, 60, 80, 0.3); 
            border: 1px solid rgba(0, 191, 255, 0.4); 
            border-radius: 24px; 
            color: white; 
            font-size: 16px; 
            transition: all 0.3s;
        }
        .input-group input:focus { outline: none; border-color: var(--primary); transform: scale(1.02); box-shadow: 0 0 15px rgba(0,191,255,0.3); }
        
        .login-btn { 
            width: 100%; 
            padding: 16px; 
            background: var(--gradient-primary);
            border: none; 
            border-radius: 24px; 
            color: white; 
            font-size: 16px; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 20px; 
            transition: all 0.3s; 
        }
        
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0, 191, 255, 0.4); }
        
        .app-container { min-height: 100vh; }
        
        .top-bar { 
            background: rgba(0, 30, 50, 0.4);
            backdrop-filter: blur(15px);
            position: fixed; 
            top: 0; 
            right: 0; 
            left: 280px; 
            height: 70px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 0 30px; 
            z-index: 999; 
            border-bottom: 1px solid rgba(0, 191, 255, 0.3);
        }
        
        .page-title { 
            font-size: 1.5em; 
            font-weight: 800; 
            background: var(--gradient-primary);
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        
        .sidebar { 
            width: 280px; 
            background: rgba(5, 5, 30, 0.95);
            backdrop-filter: blur(15px);
            position: fixed; 
            height: 100vh; 
            left: 0; 
            top: 0; 
            transition: all 0.3s; 
            z-index: 1000; 
            overflow-y: auto; 
            border-right: 1px solid rgba(0, 191, 255, 0.3);
        }
        
        .sidebar-header { padding: 25px 20px; text-align: center; border-bottom: 1px solid rgba(0, 191, 255, 0.3); }
        .sidebar-header h2 { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 1.8em; }
        
        .nav-item { 
            padding: 14px 20px; 
            margin: 6px 15px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-radius: 16px; 
            color: #cbd5e1; 
            transition: all 0.3s; 
            font-weight: 600; 
        }
        
        .nav-item:hover { background: rgba(0, 191, 255, 0.2); color: white; transform: translateX(8px); }
        .nav-item.active { background: rgba(0, 191, 255, 0.3); color: white; }
        
        .main-content { 
            margin-left: 280px; 
            margin-top: 70px; 
            padding: 30px; 
            animation: fadeInUp 0.8s ease;
            min-height: calc(100vh - 70px);
        }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 25px; margin-bottom: 35px; }
        
        .stat-card { 
            background: rgba(0, 191, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 28px; 
            transition: all 0.4s; 
            border: 1px solid rgba(0, 191, 255, 0.3);
            text-align: center;
            cursor: pointer;
        }
        
        .stat-card:hover { transform: translateY(-10px); background: rgba(0, 191, 255, 0.2); border-color: var(--primary); box-shadow: var(--shadow-neon); }
        .stat-card i { font-size: 2.5em; color: var(--primary); margin-bottom: 12px; }
        .stat-card .value { font-size: 2.2em; font-weight: 800; color: white; }
        .stat-card h3 { color: rgba(255,255,255,0.9); }
        
        .pos-interface { display: grid; grid-template-columns: 1fr 420px; gap: 25px; height: calc(100vh - 130px); }
        
        .products-panel, .cart-panel { 
            background: rgba(0, 30, 50, 0.4);
            backdrop-filter: blur(15px);
            border-radius: 28px; 
            padding: 25px; 
            border: 1px solid rgba(0, 191, 255, 0.3);
            overflow-y: auto;
        }
        
        .cart-panel { display: flex; flex-direction: column; }
        .cart-items { flex: 1; overflow-y: auto; max-height: 300px; margin-bottom: 15px; }
        
        .barcode-scanner {
            background: rgba(0, 191, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 191, 255, 0.3);
        }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 20px; margin-top: 20px; }
        
        .product-card { 
            background: rgba(0, 191, 255, 0.1);
            border-radius: 20px; 
            padding: 18px; 
            cursor: pointer; 
            transition: all 0.4s; 
            border: 1px solid rgba(0, 191, 255, 0.3);
            text-align: center;
        }
        
        .product-card:hover { 
            transform: translateY(-10px); 
            background: rgba(0, 191, 255, 0.3);
            border-color: #fff;
            box-shadow: 0 20px 30px -10px rgba(0,191,255,0.6);
        }
        
        .product-card .price { color: var(--primary); font-size: 1.3em; font-weight: 800; margin-top: 8px; }
        .product-card h4 { color: white; }
        .product-card small { color: #cbd5e1; }
        
        .cart-item { 
            background: rgba(0, 191, 255, 0.1);
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            color: white;
            border: 1px solid rgba(0, 191, 255, 0.2);
        }
        
        .payment-methods { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        
        .payment-option {
            flex: 1;
            padding: 15px;
            border-radius: 20px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            border: 2px solid transparent;
            background: rgba(0, 191, 255, 0.1);
            color: white;
        }
        
        .payment-option.active {
            border-color: var(--primary);
            background: rgba(0, 191, 255, 0.3);
            transform: scale(1.02);
        }
        
        .payment-option i { font-size: 2em; margin-bottom: 8px; display: block; }
        
        .btn { 
            padding: 14px 28px; 
            border: none; 
            border-radius: 24px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: all 0.3s; 
            color: white;
        }
        
        .btn-primary { background: var(--gradient-primary); }
        .btn-success { background: var(--gradient-primary); }
        .btn-danger { background: #ff5252; }
        .btn-warning { background: #ffb74d; color: #1a237e; }
        .btn:hover { transform: translateY(-3px); filter: brightness(1.05); }
        
        .toast { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            background: rgba(0, 30, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px; 
            padding: 14px 22px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            border-left: 4px solid #00bfff; 
            animation: slideInRight 0.3s ease; 
            z-index: 3000; 
            font-weight: 600; 
            color: white;
        }
        
        .online-badge { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            padding: 8px 16px; 
            background: var(--gradient-primary);
            color: white; 
            border-radius: 30px; 
            font-size: 11px; 
            z-index: 999; 
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .data-table { 
            background: rgba(0, 191, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px; 
            overflow-x: auto; 
            border: 1px solid rgba(0, 191, 255, 0.3);
            color: white;
        }
        
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table th { background: rgba(0, 191, 255, 0.2); color: white; }
        
        .modal { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0, 0, 0, 0.8); 
            backdrop-filter: blur(10px); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 2000; 
        }
        .modal.active { display: flex; }
        .modal-content { 
            background: rgba(0, 30, 50, 0.95);
            backdrop-filter: blur(15px);
            border-radius: 32px; 
            padding: 35px; 
            width: 100%; 
            max-width: 550px; 
            border: 1px solid rgba(0, 191, 255, 0.4);
            color: white;
        }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #cbd5e1; }
        .form-group input, .form-group select { 
            width: 100%; 
            padding: 14px; 
            background: rgba(0, 60, 80, 0.3);
            border: 1px solid rgba(0, 191, 255, 0.4); 
            border-radius: 16px; 
            color: white;
        }
        
        .user-avatar { 
            width: 45px; 
            height: 45px; 
            background: var(--gradient-primary);
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 800; 
            color: white; 
            cursor: pointer;
        }
        
        .menu-toggle { display: none; position: fixed; top: 18px; left: 18px; z-index: 1001; background: var(--primary); border: none; padding: 12px; border-radius: 12px; cursor: pointer; color: white; }
        
        @media (max-width: 1024px) {
            .pos-interface { grid-template-columns: 1fr; height: auto; }
            .top-bar { left: 0; padding-left: 70px; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .menu-toggle { display: block; }
        }
        
        .profit-card { background: rgba(0, 191, 255, 0.15); }
        .profit-value { color: #66d9ff !important; }
        
        .btn-remover-venda {
            background: #ff5252;
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            color: white;
            cursor: pointer;
        }
        
        .btn-verificar {
            background: #ffb74d;
            border: none;
            border-radius: 12px;
            padding: 10px 20px;
            color: #1a237e;
            font-weight: bold;
            cursor: pointer;
        }
        
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="app()" x-cloak>
    <!-- Login Container -->
    <div class="login-container" x-show="!isLoggedIn" x-cloak>
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon"><i class="fas fa-crown"></i></div>
                <h1>LIONS FASHION</h1>
                <p style="color: rgba(255,255,255,0.8); margin-top: 10px;">Enterprise Suite • Moçambique</p>
            </div>
            <div class="input-group">
                <label><i class="fas fa-user"></i> ID do Utilizador</label>
                <input type="text" x-model="loginId" placeholder="ADMIN001" @keyup.enter="processLogin">
            </div>
            <div class="input-group">
                <label><i class="fas fa-lock"></i> Senha</label>
                <input type="password" x-model="loginPassword" placeholder="••••••••" @keyup.enter="processLogin">
            </div>
            <button class="login-btn" @click="processLogin"><i class="fas fa-sign-in-alt"></i> Entrar no Sistema</button>
            <div style="text-align:center; margin-top:20px;">
                <small style="color:rgba(255,255,255,0.6);">👑 Admin: ADMIN001 / admin123</small><br>
                <small style="color:rgba(255,255,255,0.6);">👤 Vendedor: VEND001 / vender123</small>
            </div>
        </div>
    </div>
    
    <!-- App Container -->
    <div class="app-container" x-show="isLoggedIn" x-cloak>
        <div class="sidebar" :class="{ active: sidebarOpen }">
            <div class="sidebar-header">
                <h2>🦁 LIONS</h2>
                <div class="user-info">
                    <p style="color:white;"><strong x-text="currentUser?.name"></strong></p>
                    <p style="color:#cbd5e1;" x-text="currentUser?.role === 'admin' ? '👑 Administrador' : '👤 Vendedor'"></p>
                </div>
            </div>
            <div class="nav-item" :class="{ active: currentView === 'dashboard' }" @click="navigateTo('dashboard')"><i class="fas fa-chart-line"></i> <span>Dashboard</span></div>
            <div class="nav-item" :class="{ active: currentView === 'pos' }" @click="navigateTo('pos')"><i class="fas fa-shopping-cart"></i> <span>Ponto de Venda</span></div>
            <div class="nav-item" x-show="currentUser?.role === 'admin'" :class="{ active: currentView === 'stock' }" @click="navigateTo('stock')"><i class="fas fa-boxes"></i> <span>Gestão de Stock</span></div>
            <div class="nav-item" x-show="currentUser?.role === 'admin'" :class="{ active: currentView === 'products' }" @click="navigateTo('products')"><i class="fas fa-tags"></i> <span>Gestão de Produtos</span></div>
            <div class="nav-item" x-show="currentUser?.role === 'admin'" :class="{ active: currentView === 'sellers' }" @click="navigateTo('sellers')"><i class="fas fa-users"></i> <span>Gestão de Vendedores</span></div>
            <div class="nav-item" x-show="currentUser?.role === 'admin'" :class="{ active: currentView === 'manageSales' }" @click="navigateTo('manageSales')"><i class="fas fa-trash-alt"></i> <span>🗑️ Apagar Vendas</span></div>
            <div class="nav-item" :class="{ active: currentView === 'reports' }" @click="navigateTo('reports')"><i class="fas fa-chart-bar"></i> <span>Relatórios</span></div>
            <div class="nav-item" @click="fechoDoDia"><i class="fas fa-calendar-check"></i> <span>Fecho do Dia</span></div>
            <div class="nav-item" @click="logout"><i class="fas fa-sign-out-alt"></i> <span>Sair</span></div>
        </div>
        
        <div class="top-bar">
            <button class="menu-toggle" @click="toggleSidebar"><i class="fas fa-bars"></i></button>
            <h2 class="page-title" x-text="pageTitle"></h2>
            <div class="user-menu" style="display: flex; align-items: center; gap: 15px;">
                <span style="font-weight:600; color:white;" x-text="currentUser?.name"></span>
                <div class="user-avatar" x-text="currentUser?.name?.charAt(0) || 'U'"></div>
            </div>
        </div>
        
        <div class="main-content">
            <!-- Dashboard -->
            <template x-if="currentView === 'dashboard'">
                <div>
                    <div class="stats-grid">
                        <div class="stat-card"><i class="fas fa-chart-line"></i><h3>Total Vendas</h3><div class="value" x-text="totalSales"></div></div>
                        <div class="stat-card"><i class="fas fa-money-bill-wave"></i><h3>Receita Total</h3><div class="value" x-text="formatMoney(totalRevenue)"></div></div>
                        <div class="stat-card profit-card"><i class="fas fa-chart-pie"></i><h3>Lucro Total</h3><div class="value profit-value" x-text="formatMoney(totalProfit)"></div></div>
                        <div class="stat-card"><i class="fas fa-box"></i><h3>Stock em Mão</h3><div class="value" x-text="totalStock"></div></div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card"><i class="fas fa-calendar-day"></i><h3>Vendas Hoje</h3><div class="value" x-text="formatMoney(vendasHojeTotal)"></div></div>
                        <div class="stat-card profit-card"><i class="fas fa-coins"></i><h3>Lucro Hoje</h3><div class="value profit-value" x-text="formatMoney(lucroHoje)"></div></div>
                    </div>
                    <div class="data-table">
                        <h3 style="padding: 20px;">🏆 Produtos Mais Vendidos</h3>
                        <table style="width:100%;">
                            <thead><tr><th>Produto</th><th>Unidades</th></tr></thead>
                            <tbody>
                                <template x-for="item in topProducts" :key="item.name">
                                    <tr><td x-text="item.name"></td><td x-text="item.qty"></td></tr>
                                </template>
                                <tr x-show="topProducts.length === 0"><td colspan="2">Sem dados ainda</td></tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="data-table" style="margin-top: 25px;">
                        <h3 style="padding: 20px;">🔄 Últimas Vendas</h3>
                        <table style="width:100%;">
                            <thead><tr><th>Factura</th><th>Data</th><th>Vendedor</th><th>Total</th><th>Lucro</th></tr></thead>
                            <tbody>
                                <template x-for="sale in recentSales" :key="sale.id">
                                    <tr>
                                        <td x-text="sale.invoice || 'N/A'"></td>
                                        <td x-text="formatDate(sale.date)"></td>
                                        <td x-text="sale.seller || 'N/A'"></td>
                                        <td x-text="formatMoney(sale.total || 0)"></td>
                                        <td style="color:#66d9ff;" x-text="formatMoney(sale.profit || 0)"></td>
                                    </tr>
                                </template>
                                <tr x-show="recentSales.length === 0"><td colspan="5">Sem vendas registadas</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </template>

            <!-- Ponto de Venda -->
            <template x-if="currentView === 'pos'">
                <div class="pos-interface">
                    <div class="products-panel">
                        <div class="barcode-scanner">
                            <label><i class="fas fa-barcode"></i> Leitor de Código de Barras</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" x-model="barcodeInput" placeholder="Digite ou escaneie o código de barras..." style="flex: 1; padding: 12px; border-radius: 12px; border: none;">
                                <button class="btn btn-primary" @click="addByBarcode" style="padding: 12px 20px;"><i class="fas fa-plus"></i> Adicionar</button>
                            </div>
                        </div>
                        <div class="search-box">
                            <input type="text" x-model="searchQuery" placeholder="Pesquisar produto..." style="width:100%; padding:12px; border-radius:24px; border:none;">
                        </div>
                        <div class="products-grid">
                            <template x-for="product in filteredProducts" :key="product.id">
                                <div class="product-card" @click="addToCart(product.id)">
                                    <h4 x-text="product.name"></h4>
                                    <div class="price" x-text="formatMoney(product.salePrice)"></div>
                                    <small x-text="'📦 ' + product.category + ' • Stock: ' + product.stock"></small>
                                </div>
                            </template>
                            <p x-show="filteredProducts.length === 0" style="text-align:center;color:white;">Nenhum produto encontrado</p>
                        </div>
                    </div>
                    <div class="cart-panel">
                        <h3 style="color:white;"><i class="fas fa-shopping-cart"></i> Carrinho</h3>
                        <div class="cart-items">
                            <template x-for="(item, idx) in cart" :key="item.id">
                                <div class="cart-item">
                                    <div>
                                        <strong x-text="item.name"></strong><br>
                                        <span x-text="formatMoney(item.price) + ' MZN x ' + item.quantity"></span><br>
                                        <small>Subtotal: <span x-text="formatMoney(item.price * item.quantity)"></span> MZN</small>
                                    </div>
                                    <button class="btn btn-danger" style="padding:8px 12px;" @click="removeFromCart(idx)"><i class="fas fa-trash"></i></button>
                                </div>

    </div>

    <script>
        // Configuração Supabase
        const SUPABASE_URL = "https://ndcmhuiuhnxmtblsbxmc.supabase.co";
        const SUPABASE_KEY = "sb_publishable_a27v01_Evo8ocfrOACzXrQ_X_oKJv4V";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        function app() {
            return {
                // Estado
                isLoggedIn: false,
                currentUser: null,
                sidebarOpen: false,
                currentView: 'dashboard',
                loginId: '',
                loginPassword: '',
                
                products: [],
                sales: [],
                users: [],
                cart: [],
                paymentMethod: 'Dinheiro MZN',
                amountReceived: 0,
                searchQuery: '',
                barcodeInput: '',
                stockBarcodeInput: '',
                
                // Devolução
                devolucaoModalOpen: false,
                devolucaoData: { nome: '', categoria: 'Calçado', preco: '', quantidade: 1 },
                
                // Auth
                authCode: '',
                authVerified: false,
                
                // Computed
                get pageTitle() {
                    const titles = { dashboard: 'Dashboard', pos: 'Ponto de Venda', stock: 'Gestão de Stock', products: 'Gestão de Produtos', sellers: 'Gestão de Vendedores', reports: 'Relatórios', manageSales: 'Apagar Vendas' };
                    return titles[this.currentView] || this.currentView;
                },
                get totalSales() { return this.sales.length; },
                get totalRevenue() { return this.sales.reduce((sum, s) => sum + (s.total || 0), 0); },
                get totalProfit() { return this.sales.reduce((sum, s) => sum + (s.profit || 0), 0); },
                get totalStock() { return this.products.reduce((sum, p) => sum + (p.stock || 0), 0); },
                get vendasHojeTotal() {
                    const hoje = new Date().toDateString();
                    return this.sales.filter(s => new Date(s.date).toDateString() === hoje).reduce((sum, s) => sum + (s.total || 0), 0);
                },
                get lucroHoje() {
                    const hoje = new Date().toDateString();
                    return this.sales.filter(s => new Date(s.date).toDateString() === hoje).reduce((sum, s) => sum + (s.profit || 0), 0);
                },
                get topProducts() {
                    const productSales = {};
                    this.sales.forEach(sale => {
                        let items = sale.items;
                        if (typeof items === 'string') { try { items = JSON.parse(items); } catch(e) { items = []; } }
                        if (items && Array.isArray(items)) items.forEach(item => { if (item?.name) productSales[item.name] = (productSales[item.name] || 0) + (item.quantity || 0); });
                    });
                    return Object.entries(productSales).map(([name, qty]) => ({ name, qty })).sort((a, b) => b.qty - a.qty).slice(0, 5);
                },
                get recentSales() { return this.sales.slice(0, 10); },
                get sellers() { return this.users.filter(u => u.role === 'seller'); },
                get filteredProducts() {
                    const search = this.searchQuery.toLowerCase();
                    return this.products.filter(p => p.stock > 0 && (p.name.toLowerCase().includes(search) || (p.barcode && p.barcode.includes(search))));
                },
                get cartTotal() { return this.cart.reduce((sum, i) => sum + (i.price * i.quantity), 0); },
                get changeAmount() { return this.amountReceived - this.cartTotal; },
                
                // Métodos
                formatMoney(value) { return (value || 0).toLocaleString() + ' MZN'; },
                formatDate(dateStr) { return new Date(dateStr).toLocaleString(); },
                formatChange() {
                    const change = this.changeAmount;
                    if (change >= 0) return `${change.toLocaleString()} MZN`;
                    return `Faltam ${Math.abs(change).toLocaleString()} MZN`;
                },
                
                showToast(msg, type = 'success') {
                    const toast = document.createElement('div');
                    toast.className = 'toast';
                    toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-circle'}"></i><span>${msg}</span>`;
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 3000);
                },
                
                notificarGerente(titulo, mensagem) {
                    const notificacao = document.createElement('div');
                    notificacao.className = 'toast';
                    notificacao.style.background = 'var(--gradient-primary)';
                    notificacao.innerHTML = `<i class="fas fa-bell"></i><strong>${titulo}</strong><span>${mensagem}</span>`;
                    document.body.appendChild(notificacao);
                    setTimeout(() => notificacao.remove(), 5000);
                },
                
                async loadAllData() {
                    try {
                        const [produtosRes, vendasRes, usuariosRes] = await Promise.all([
                            supabaseClient.from('products').select('*'),
                            supabaseClient.from('sales').select('*').order('date', { ascending: false }),
                            supabaseClient.from('users').select('*')
                        ]);
                        if (produtosRes.data) this.products = produtosRes.data;
                        if (vendasRes.data) this.sales = vendasRes.data;
                        if (usuariosRes.data) this.users = usuariosRes.data;
                    } catch (err) { console.error("Erro:", err); }
                },
                
                async saveProducts() {
                    for (const p of this.products) await supabaseClient.from('products').upsert(p);
                },
                
                async processLogin() {
                    await this.loadAllData();
                    const user = this.users.find(u => u.userid === this.loginId && u.password === this.loginPassword);
                    if (user) {
                        this.currentUser = user;
                        this.isLoggedIn = true;
                        this.showToast(`Bem-vindo(a) ${user.name}!`, 'success');
                        this.navigateTo('dashboard');
                    } else {
                        this.showToast('ID ou senha incorretos!', 'error');
                    }
                },
                
                logout() {
                    this.currentUser = null;
                    this.isLoggedIn = false;
                    this.cart = [];
                },
                
                toggleSidebar() { this.sidebarOpen = !this.sidebarOpen; },
                
                navigateTo(view) {
                    this.currentView = view;
                    this.sidebarOpen = false;
                    if (view === 'reports') {
                        setTimeout(() => this.initChart(), 100);
                    }
                },
                
                initChart() {
                    const vendasPorVendedor = {};
                    this.sales.forEach(s => { vendasPorVendedor[s.seller] = (vendasPorVendedor[s.seller] || 0) + (s.total || 0); });
                    const canvas = document.getElementById('vendedorChart');
                    if (canvas && typeof Chart !== 'undefined') {
                        new Chart(canvas, { 
                            type: 'pie', 
                            data: { 
                                labels: Object.keys(vendasPorVendedor), 
                                datasets: [{ data: Object.values(vendasPorVendedor), backgroundColor: ['#00bfff', '#e2006e', '#00a859', '#ffb74d'] }] 
                            }
                        });
                    }
                },
                
                addToCart(id) {
                    const product = this.products.find(p => p.id === id);
                    if (!product) return;
                    const existing = this.cart.find(item => item.id === id);
                    if (existing) {
                        if (existing.quantity + 1 <= product.stock) existing.quantity++;
                        else this.showToast('Stock insuficiente!', 'error');
                    } else {
                        if (product.stock > 0) this.cart.push({ id: product.id, name: product.name, price: product.salePrice, quantity: 1, profit: product.profit || (product.salePrice - (product.purchasePrice || 0)) });
                    }
                },
                
                removeFromCart(idx) { this.cart.splice(idx, 1); },
                
                async addByBarcode() {
                    const barcode = this.barcodeInput.trim();
                    if (!barcode) { this.showToast('Digite um código!', 'warning'); return; }
                    const product = this.products.find(p => p.barcode === barcode);
                    if (!product) { this.showToast('Produto não encontrado!', 'error'); this.barcodeInput = ''; return; }
                    if (product.stock <= 0) { this.showToast('Produto sem stock!', 'error'); this.barcodeInput = ''; return; }
                    this.addToCart(product.id);
                    this.barcodeInput = '';
                    this.showToast(`✅ ${product.name} adicionado!`, 'success');
                },
                
                async scanForStock() {
                    const barcode = this.stockBarcodeInput.trim();
                    if (!barcode) { this.showToast('Digite um código!', 'warning'); return; }
                    const product = this.products.find(p => p.barcode === barcode);
                    if (!product) { this.showToast('Produto não encontrado!', 'error'); this.stockBarcodeInput = ''; return; }
                    const novaQuantidade = prompt(`Produto: ${product.name}\nStock atual: ${product.stock}\nDigite a nova quantidade:`);
                    if (novaQuantidade && !isNaN(novaQuantidade)) {
                        product.stock = parseInt(novaQuantidade);
                        await this.saveProducts();
                        this.showToast(`✅ Stock de ${product.name} atualizado!`, 'success');
                    }
                    this.stockBarcodeInput = '';
                },
                
                async updateStock(id) {
                    const novo = prompt('Digite a nova quantidade:');
                    if (novo && !isNaN(novo)) {
                        const prod = this.products.find(p => p.id === id);
                        if (prod) { prod.stock = parseInt(novo); await this.saveProducts(); this.showToast(`Stock atualizado!`, 'success'); }
                    }
                },
                
                printReceipt(sale) {
                    let itemsList = sale.items;
                    if (typeof itemsList === 'string') { try { itemsList = JSON.parse(itemsList); } catch(e) { itemsList = []; } }
                    let itensStr = '';
                    if (itemsList && Array.isArray(itemsList)) {
                        itemsList.forEach(item => { itensStr += `${item.name}\n${item.quantity} x ${item.price.toLocaleString()} MZN     ${(item.price * item.quantity).toLocaleString()} MZN\n`; });
                    }
                    const linhaSep = '********************************';
                    const recibo = `
                        <div style="text-align:center; font-family:monospace; width:280px; margin:0 auto;">
                            🦁 LIONS FASHION\nAv. Julius Nyerere n°6600\nMaputo\n${linhaSep}\nFACTURA: ${sale.invoice}\nDATA: ${new Date(sale.date).toLocaleString()}\nATENDENTE: ${sale.seller}\n${linhaSep}\n${itensStr}${linhaSep}\nTOTAL: ${sale.total.toLocaleString()} MZN\nPAGAMENTO: ${sale.payment_method}\n${linhaSep}\nOBRIGADO!\n${linhaSep}
                        </div>
                    `;
                    const win = window.open('', '_blank');
                    if (win) {
                        win.document.write(`<html><head><title>Recibo</title><style>body{font-family:monospace;width:280px;margin:0 auto;padding:10px;text-align:center;}</style></head><body>${recibo}<script>window.print();setTimeout(()=>window.close(),500);<\/script></body></html>`);
                        win.document.close();
                    }
                },
                
                async finalizeSale() {
                    if (this.cart.length === 0) { this.showToast('Carrinho vazio', 'error'); return; }
                    const total = this.cartTotal;
                    const totalProfit = this.cart.reduce((s, i) => s + ((i.profit || 0) * i.quantity), 0);
                    const received = this.amountReceived;
                    if (this.paymentMethod === 'Dinheiro MZN' && received < total) { this.showToast('Valor insuficiente!', 'error'); return; }
                    const itens = this.cart.map(i => ({ name: i.name, price: i.price, quantity: i.quantity, profit: i.profit || 0 }));
                    const saleData = { 
                        date: new Date().toISOString(), total, profit: totalProfit, items: JSON.stringify(itens),
                        seller: this.currentUser?.name, payment_method: this.paymentMethod, received, change: received - total,
                        invoice: `INV-${Date.now()}`
                    };
                    const { error } = await supabaseClient.from('sales').insert([saleData]);
                    if (error) { this.showToast('Erro: ' + error.message, 'error'); return; }
                    for (const item of this.cart) {
                        const prod = this.products.find(p => p.id === item.id);
                        if (prod) prod.stock -= item.quantity;
                    }
                    await this.saveProducts();
                    this.printReceipt(saleData);
                    this.sales.unshift(saleData);
                    this.notificarGerente('🛒 Nova Venda!', `${this.currentUser?.name} vendeu ${this.formatMoney(total)} via ${this.paymentMethod}`);
                    this.cart = [];
                    this.amountReceived = 0;
                    this.showToast(`✅ Venda de ${this.formatMoney(total)} registrada!`, 'success');
                },
                
                async fechoDoDia() {
                    if (!confirm('⚠️ Tem certeza? Todas as vendas de hoje serão removidas.')) return;
                    const hoje = new Date();
                    const inicioDia = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
                    const vendasHoje = this.sales.filter(s => new Date(s.date) >= inicioDia);
                    if (vendasHoje.length === 0) { this.showToast('Não há vendas hoje!', 'warning'); return; }
                    for (const venda of vendasHoje) await supabaseClient.from('sales').delete().eq('id', venda.id);
                    await this.loadAllData();
                    this.showToast(`✅ Fecho do dia concluído!`, 'success');
                },
                
                abrirModalDevolucao() { this.devolucaoModalOpen = true; },
                fecharModalDevolucao() { this.devolucaoModalOpen = false; },
                
                async confirmarDevolucao() {
                    const nome = this.devolucaoData.nome.trim();
                    const preco = parseFloat(this.devolucaoData.preco);
                    const quantidade = parseInt(this.devolucaoData.quantidade);
                    if (!nome || isNaN(preco) || preco <= 0 || isNaN(quantidade) || quantidade <= 0) {
                        this.showToast('Preencha todos os campos!', 'error'); return;
                    }
                    const produtoExistente = this.products.find(p => p.name.toLowerCase() === nome.toLowerCase());
                    if (produtoExistente) {
                        produtoExistente.stock += quantidade;
                        await supabaseClient.from('products').upsert(produtoExistente);
                    } else {
                        const novoId = Math.max(...this.products.map(p => p.id), 0) + 1;
                        this.products.push({ id: novoId, name: nome, category: this.devolucaoData.categoria, salePrice: preco, purchasePrice: preco * 0.7, stock: quantidade, profit: preco * 0.3, barcode: `DEV-${Date.now()}` });
                        await this.saveProducts();
                    }
                    const valorTotal = preco * quantidade;
                    const devolucaoData = {
                        date: new Date().toISOString(), total: -valorTotal, profit: -(preco * 0.3 * quantidade),
                        items: JSON.stringify([{ name: nome, price: preco, quantity: quantidade, profit: preco * 0.3 }]),
                        seller: this.currentUser?.name, payment_method: "Devolução", invoice: `DEV-${Date.now()}`
                    };
                    await supabaseClient.from('sales').insert([devolucaoData]);
                    this.fecharModalDevolucao();
                    await this.loadAllData();
                    this.showToast(`✅ Devolução registrada!`, 'success');
                },
                
                async verificarCodigo() {
                    if (this.authCode === '7720') {
                        this.authVerified = true;
                        this.showToast('✅ Acesso concedido!', 'success');
                    } else {
                        this.showToast('❌ Código inválido!', 'error');
                        this.authVerified = false;
                    }
                },
                
                async removerVenda(saleId) {
                    if (!confirm('⚠️ Remover esta venda? Os produtos serão devolvidos ao stock.')) return;
                    try {
                        const { data: sale } = await supabaseClient.from('sales').select('*').eq('id', saleId).single();
                        let items = sale.items;
                        if (typeof items === 'string') { try { items = JSON.parse(items); } catch(e) { items = []; } }
                        if (items && Array.isArray(items)) {
                            for (const item of items) {
                                const produto = this.products.find(p => p.name === item.name);
                                if (produto) { produto.stock += item.quantity; await supabaseClient.from('products').upsert(produto); }
                            }
                        }
                        await supabaseClient.from('sales').delete().eq('id', saleId);
                        await this.loadAllData();
                        this.showToast('✅ Venda removida!', 'success');
                    } catch (error) { this.showToast('❌ Erro!', 'error'); }
                },
                
                showProductModal(product = null) {
                    const modal = document.createElement('div');
                    modal.className = 'modal active';
                    modal.innerHTML = `
                        <div class="modal-content">
                            <h3>${product ? 'Editar Produto' : 'Novo Produto'}</h3>
                            <div class="form-group"><label>Nome</label><input type="text" id="prodName" value="${product ? product.name : ''}"></div>
                            <div class="form-group"><label>Categoria</label><select id="prodCategory"><option>Calçado</option><option>Vestuário</option><option>Bolsa</option><option>Pasta</option></select></div>
                            <div class="form-group"><label>Código Barras</label><input type="text" id="prodBarcode" value="${product ? (product.barcode || '') : ''}"></div>
                            <div class="form-group"><label>Preço Compra</label><input type="number" id="prodPurchase" value="${product ? product.purchasePrice : ''}"></div>
                            <div class="form-group"><label>Preço Venda</label><input type="number" id="prodSale" value="${product ? product.salePrice : ''}"></div>
                            <div class="form-group"><label>Stock</label><input type="number" id="prodStock" value="${product ? product.stock : '0'}"></div>
                            <div style="display:flex;gap:10px;"><button class="btn btn-danger" onclick="this.closest('.modal').remove()">Cancelar</button><button class="btn btn-success" id="saveProductBtn">Salvar</button></div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    const saveBtn = modal.querySelector('#saveProductBtn');
                    saveBtn.onclick = async () => {
                        const name = modal.querySelector('#prodName').value;
                        const category = modal.querySelector('#prodCategory').value;
                        const barcode = modal.querySelector('#prodBarcode').value.trim();
                        const purchasePrice = parseFloat(modal.querySelector('#prodPurchase').value) || 0;
                        const salePrice = parseFloat(modal.querySelector('#prodSale').value);
                        const stock = parseInt(modal.querySelector('#prodStock').value);
                        if (!name || isNaN(salePrice)) { this.showToast('Preencha os campos!', 'error'); return; }
                        if (product) {
                            const idx = this.products.findIndex(p => p.id === product.id);
                            if (idx !== -1) this.products[idx] = { ...this.products[idx], name, category, barcode: barcode || null, purchasePrice, salePrice, stock, profit: salePrice - purchasePrice };
                        } else {
                            const newId = Math.max(...this.products.map(p => p.id), 0) + 1;
                            this.products.push({ id: newId, name, category, barcode: barcode || null, purchasePrice, salePrice, stock, profit: salePrice - purchasePrice });
                        }
                        await this.saveProducts();
                        modal.remove();
                        this.showToast('✅ Produto salvo!', 'success');
                    };
                },
                
                editProduct(id) { const p = this.products.find(p => p.id === id); if (p) this.showProductModal(p); },
                
                async deleteProduct(id) {
                    if (confirm('Excluir produto?')) {
                        this.products = this.products.filter(p => p.id !== id);
                        await this.saveProducts();
                        this.showToast('Produto excluído!', 'success');
                    }
                },
                
                showSellerModal() {
                    const modal = document.createElement('div');
                    modal.className = 'modal active';
                    modal.innerHTML = `
                        <div class="modal-content">
                            <h3>Novo Vendedor</h3>
                            <div class="form-group"><label>ID</label><input type="text" id="sellerId" placeholder="VEND002"></div>
                            <div class="form-group"><label>Nome</label><input type="text" id="sellerName"></div>
                            <div class="form-group"><label>Senha</label><input type="password" id="sellerPass"></div>
                            <div style="display:flex;gap:10px;"><button class="btn btn-danger" onclick="this.closest('.modal').remove()">Cancelar</button><button class="btn btn-success" id="saveSellerBtn">Cadastrar</button></div>
                        </div>
                    `;
                    document.body.appendChild(modal);
                    const saveBtn = modal.querySelector('#saveSellerBtn');
                    saveBtn.onclick = async () => {
                        const userId = modal.querySelector('#sellerId').value;
                        const name = modal.querySelector('#sellerName').value;
                        const password = modal.querySelector('#sellerPass').value;
                        if (!userId || !name || !password) { this.showToast('Preencha todos!', 'error'); return; }
                        if (this.users.find(u => u.userId === userId)) { this.showToast('ID já existe!', 'error'); return; }
                        const newId = Math.max(...this.users.map(u => u.id), 0) + 1;
                        const newUser = { id: newId, userId, password, name, role: 'seller', createdAt: new Date().toISOString() };
                        this.users.push(newUser);
                        await supabaseClient.from('users').upsert(newUser);
                        modal.remove();
                        this.showToast('Vendedor cadastrado!', 'success');
                    };
                },
                
                async deleteSeller(id) {
                    if (confirm('Excluir vendedor?')) {
                        this.users = this.users.filter(u => u.id !== id);
                        await supabaseClient.from('users').delete().eq('id', id);
                        this.showToast('Vendedor excluído!', 'success');
                    }
                }
            }
        }
    </script>
</body>
</html>
